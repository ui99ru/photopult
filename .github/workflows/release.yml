name: Release

# Builds a signed APK + AAB whenever a v* tag is pushed (e.g. v1.2.3), and publishes them to a
# GitHub Release. versionName is the tag without the leading "v"; versionCode is derived from the
# semver so it always increases (1.2.3 → 10203). Manual runs take the tag as an input.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          # semver major.minor.patch -> code = major*10000 + minor*100 + patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG -> versionName=$VERSION versionCode=$CODE"

      - name: Checkout ${{ steps.tag.outputs.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret — cannot sign the release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PPHOTOPULT_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PPHOTOPULT_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PPHOTOPULT_KEY_ALIAS="$KEY_ALIAS" \
            -PPHOTOPULT_KEY_PASSWORD="$KEY_PASSWORD" \
            -PPHOTOPULT_VERSION_NAME="${{ steps.tag.outputs.version }}" \
            -PPHOTOPULT_VERSION_CODE="${{ steps.tag.outputs.code }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/photopult-${{ steps.tag.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab \
            "dist/photopult-${{ steps.tag.outputs.version }}.aab"
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Фотопульт ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          files: |
            dist/photopult-${{ steps.tag.outputs.version }}.apk
            dist/photopult-${{ steps.tag.outputs.version }}.aab
